# .github/workflows/mlflow-ci.yml
name: MLflow CI Training

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy matplotlib seaborn joblib

      - name: Run MLflow Training
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          python modelling.py  # ← Langsung python, mlruns dibuat di MLProject/

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_id }}
          path: MLProject/mlruns/
          retention-days: 30

      - name: Commit mlruns back to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add MLProject/mlruns/
          git diff --staged --quiet || git commit -m "Update MLflow runs from CI [skip ci]" || echo "No changes"
          git push || echo "Nothing to push"