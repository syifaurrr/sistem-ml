name: MLflow CI Training

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy matplotlib seaborn joblib

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local   # ← FIX: --env-manager=local, bukan --no-conda

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_id }}
          path: mlruns/   # ← FIX: Sesuaikan lokasi mlruns
          retention-days: 30

      - name: Commit mlruns back to repo (Skilled)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mlruns/   # ← FIX: Sesuaikan lokasi
          git diff --staged --quiet || git commit -m "Update MLflow runs from CI [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"