name: Preprocess Dataset

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn kagglehub

    - name: Run preprocessing script
      run: python automate_Muhammad_Syifaurrohman.py   # ← GANTI NAMA FILE

    - name: Upload cleaned data as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cleaned-data
        path: data_clean.csv

    - name: Commit and push cleaned data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data_clean.csv
        git diff --staged --quiet || git commit -m "Update cleaned dataset [skip ci]" || echo "No changes to commit"
        git push || echo "Nothing to push"